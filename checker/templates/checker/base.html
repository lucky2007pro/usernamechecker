<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Telegram Nikneym Tekshiruvchi (Django){% endblock %}</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --card-border: #334155;
            --text: #f8fafc;
            --muted: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #0284c7;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding-bottom: 40px;
        }
        .navbar {
            background: #0b1120;
            border-bottom: 1px solid var(--card-border);
            padding: 14px 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .navbar-brand {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--primary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .container {
            max-width: 1120px;
            margin: 22px auto;
            padding: 0 16px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 18px;
            margin-bottom: 18px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }
        .card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 18px;
        }
        .card h2 {
            font-size: 1.08rem;
            margin-bottom: 10px;
            color: #e2e8f0;
        }
        .stat-box {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }
        .stat-number {
            font-size: 1.8rem;
            font-weight: 800;
            margin-top: 4px;
        }
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }
        .text-primary { color: var(--primary); }
        .text-warning { color: var(--warning); }
        .text-muted { color: var(--muted); font-size: 0.88rem; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 15px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.15s ease;
        }
        .btn:hover { opacity: 0.9; }
        .btn-primary { background: var(--primary); color: #0f172a; }
        .btn-success { background: var(--success); color: #052e16; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--card-border);
            color: var(--text);
        }
        .form-group { margin-bottom: 12px; }
        .form-label {
            display: block;
            font-size: 0.88rem;
            color: var(--muted);
            margin-bottom: 5px;
        }
        .form-control {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: #0f172a;
            color: var(--text);
            font-size: 0.95rem;
        }
        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 0.92rem;
            border-left: 4px solid var(--primary);
            background: #1e293b;
        }
        .alert-success { border-left-color: var(--success); }
        .alert-error { border-left-color: var(--danger); }
        .alert-warning { border-left-color: var(--warning); }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 700;
        }
        .badge-free { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
        .badge-taken { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        .badge-cache { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }

        .progress-bar-wrap {
            width: 100%;
            height: 12px;
            background: #0f172a;
            border-radius: 99px;
            overflow: hidden;
            margin: 10px 0;
            border: 1px solid var(--card-border);
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #22c55e);
            transition: width 0.3s ease;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th, td {
            padding: 9px 10px;
            border-bottom: 1px solid var(--card-border);
            text-align: left;
        }
        th { color: var(--muted); font-weight: 600; }
        .scroll-box {
            max-height: 340px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="{% url 'checker:index' %}" class="navbar-brand">
            ⚡ Telegram Username Checker (Django + .txt Cache)
        </a>
        <div class="nav-links">
            <a href="{% url 'checker:download_txt' 'available' %}" class="btn btn-success">
                ⬇ Bo'sh nikneymlar (.txt)
            </a>
            <a href="{% url 'checker:download_txt' 'checked' %}" class="btn btn-outline">
                ⬇ Barcha tekshirilganlar (.txt)
            </a>
            <a href="{% url 'checker:download_txt' 'sample' %}" class="btn btn-outline">
                ⬇ Namuna so'zlar (.txt)
            </a>
            <a href="{% url 'checker:telegram_auth' %}" class="btn btn-primary">
                ⚙ Telegram & .env Sozlamalari
            </a>
        </div>
    </nav>

    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags == 'error' %}alert-error{% elif message.tags == 'success' %}alert-success{% elif message.tags == 'warning' %}alert-warning{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>
